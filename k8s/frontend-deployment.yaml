apiVersion: apps/v1
kind: Deployment
metadata:
  name: jewelkart-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jewelkart-frontend
  template:
    metadata:
      labels:
        app: jewelkart-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/dps84-dot/jewelkart-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
